baseURL = "https://torontobeerblog.com/"
languageCode = "en-ca"
title = "Toronto Beer Blog"
timeZone = "America/Toronto"
summaryLength = 45
enableRobotsTXT = true

[params]
  description = "Beer reviews, news and events from Toronto, 2010–2017. An archive by Chris Schryer."
  author = "Chris Schryer"

[pagination]
  pagerSize = 20

# Keep WordPress-style taxonomy URLs: /category/beer-review/ and /tag/saison/
[taxonomies]
  category = "categories"
  tag = "tags"

[permalinks]
  categories = "/category/:slug/"
  tags = "/tag/:slug/"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup.goldmark.renderer]
  # old posts are raw HTML; allow HTML inside any new Markdown posts too
  unsafe = true

[sitemap]
  changeFreq = "yearly"
