<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}
<style>
:root{--bg:#fbfaf7;--fg:#222;--muted:#6b6b6b;--rule:#e4e0d8;--link:#8a4b08;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1a1917;--fg:#e8e6e1;--muted:#a09d97;--rule:#33312d;--link:#e0a458;--card:#22211e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.65 Georgia,"Times New Roman",serif}
a{color:var(--link)}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.1rem}
header.site{border-bottom:1px solid var(--rule);padding:1.4rem 0 1rem;margin-bottom:2rem}
header.site a.name{font-size:1.6rem;font-weight:bold;color:var(--fg);text-decoration:none}
header.site nav{margin-top:.4rem;font:15px/1.4 system-ui,sans-serif}
header.site nav a{margin-right:1rem;color:var(--muted)}
.note{font:14px/1.5 system-ui,sans-serif;color:var(--muted);background:var(--card);border:1px solid var(--rule);padding:.6rem .9rem;border-radius:6px;margin-bottom:2rem}
h1{line-height:1.25;margin:.2rem 0 .3rem}
.meta{font:14px/1.5 system-ui,sans-serif;color:var(--muted);margin-bottom:1.5rem}
.meta a{color:var(--muted)}
article img{max-width:100%;height:auto}
article .alignleft{float:left;margin:.3rem 1.2rem .8rem 0}
article .alignright{float:right;margin:.3rem 0 .8rem 1.2rem}
article .aligncenter{display:block;margin:1rem auto}
article iframe{max-width:100%}
article::after{content:"";display:block;clear:both}
.wp-caption{max-width:100%}.wp-caption-text{font-size:.85rem;color:var(--muted)}
blockquote{border-left:3px solid var(--rule);margin-left:0;padding-left:1rem;color:var(--muted)}
.list-item{padding:1.1rem 0;border-bottom:1px solid var(--rule)}
.list-item h2{font-size:1.25rem;margin:0 0 .2rem}
.list-item h2 a{color:var(--fg);text-decoration:none}
.list-item p{margin:.3rem 0 0}
.pager{display:flex;justify-content:space-between;margin:2rem 0;font:15px system-ui,sans-serif}
.comments{margin-top:3rem;border-top:1px solid var(--rule);padding-top:1rem}
.comment{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:.7rem 1rem;margin:.8rem 0}
.comment .who{font:14px/1.4 system-ui,sans-serif;color:var(--muted)}
.comment .who b{color:var(--fg)}
.comment.reply{margin-left:2rem}
.comment p{margin:.4rem 0}
.mentions{font:14px/1.5 system-ui,sans-serif;color:var(--muted)}
.terms a{display:inline-block;margin:0 .8rem .4rem 0}
footer.site{border-top:1px solid var(--rule);margin-top:3rem;padding:1.2rem 0 2rem;font:14px system-ui,sans-serif;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <a class="name" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  <nav>
    <a href="{{ "/archives/" | relURL }}">Archives</a>
    <a href="{{ "/categories/" | relURL }}">Categories</a>
    <a href="{{ "/homebrew/" | relURL }}">Homebrew</a>
    <a href="{{ "/tags/" | relURL }}">Tags</a>
  </nav>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site">
  © {{ site.Params.author }}. Written 2010–2017; archived {{ now.Format "2006" }}.
</footer>
</div>
</body>
</html>
